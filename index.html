<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工一網站缺漏進度</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: the user's sitemap — dark dotted ground, a teal pill per page, its section pills in a row below. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#1E1E1E; --dot:#3A3A3A; --page:#2F7F79; --sec:#1F3836; --sec-hover:#27474A;
  --ink:#FFFFFF; --muted:#9FB3B1; --line:#3E5553; --todo:#E0B15A; --done:#7FD3C9;
  --f:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:500 14px/1.5 var(--f);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:22px 22px}
.wrap{max-width:1000px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:64px}
.top{text-align:center;display:grid;gap:4px}
.top h1{margin:0;font:700 20px/1.3 var(--f);letter-spacing:.04em}
.top p{margin:0;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
#map{display:grid;gap:64px}
.page{display:grid;justify-items:center;gap:22px}
.pill{border:0;border-radius:999px;color:var(--ink);font:500 14px/1.25 var(--f);text-align:center;padding:12px 18px}
.pp{background:var(--page);width:min(250px,100%);padding-block:14px;letter-spacing:.02em}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.sp{background:var(--sec);width:152px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.sp{cursor:pointer}
button.sp:hover,button.sp[aria-expanded="true"]{background:var(--sec-hover)}
button.sp[aria-expanded="true"]{outline:1.5px solid var(--done);outline-offset:0}
.sp .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--todo)}
.sp .n.ok{color:var(--done)}
button:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.items{width:min(640px,100%);display:grid;gap:28px;padding-top:6px}
.it{display:grid;gap:10px}
.it h3{margin:0;font:700 16px/1.4 var(--f)}
.it .spec{margin:0;color:var(--muted);font-weight:400;font-size:13px;white-space:pre-line}
.st{display:flex;gap:18px}
.st button{background:none;border:0;padding:2px 0;color:var(--muted);font:500 13px var(--f);cursor:pointer}
.st button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.st button[aria-pressed="true"][data-s="todo"]{text-decoration-color:var(--todo)}
.st button[aria-pressed="true"][data-s="done"]{text-decoration-color:var(--done)}
textarea{width:100%;min-height:40px;resize:vertical;background:transparent;color:var(--ink);font:400 13px/1.5 var(--f);border:0;border-bottom:1px solid var(--line);padding:6px 0}
textarea:focus-visible{outline:none;border-bottom-color:var(--done)}
textarea::placeholder{color:#6F807E}
.up{justify-self:start;color:var(--done);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.up.over{color:var(--todo)}
.files{display:flex;flex-wrap:wrap;gap:12px}
.file{position:relative;width:96px;font-size:11px;color:var(--muted)}
.file img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;border-radius:6px}
.file a{color:inherit;text-decoration:none}
.file .nm{display:block;padding-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .rm{position:absolute;top:2px;right:4px;background:none;border:0;color:var(--ink);cursor:pointer;font-size:16px;text-shadow:0 0 4px #000}
.msg{font-size:12px;color:var(--todo);min-height:1em}
.note{font-size:12px;color:var(--muted);font-weight:400}
@media (max-width:520px){.sp{width:calc(50% - 4px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>工一網站缺漏進度</h1>
    <p id="sum">載入中…</p>
  </div>
  <div id="map"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://vvzkpeeiyvwnlaxhuxxx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qXJ7ioYfy-1A3YdKkM4VBw_YXHJKB9a';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const SITE = [
  ['HOME', ['Visual Banner', '合作夥伴及客戶 Logo 牆', '公司定位', '數據指標', '服務項目']],
  ['ABOUT', ['Visual Banner', 'Founder 自介', '團隊介紹', '整合能力', '工一故事', '公司環境']],
  ['SERVICE', ['Visual Banner', '建築全生命週期 3D', '產品平台', '支援系統與格式', '核心技術', '全生命週期時間線']],
  ['PROJECTS', ['Visual Banner', '曲面展示廳', '專案詳細視窗', '全部專案清單']],
  ['ADVISORS & AWARDS', ['Visual Banner', '顧問', '研究合作夥伴 UCLA', '獲獎與報導']],
  ['CAREER', ['International Career Banner', '職缺內容與流程', 'Internship Program Banner', '實習內容與流程']],
  ['全站', ['頁尾', '照片授權', 'Logo 授權']],
];
const STATUS = { todo: '待處理', doing: '進行中', done: '已完成' };

let loaded = false, tasks = [], uploads = [], open = null, msg = '', busy = false;
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c != null) n.append(c);
  return n;
};
const itemsOf = (p, s) => tasks.filter((t) => t.page === p && t.section === s);
const fileUrl = (path) => sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;

async function load() {
  const [t, u] = await Promise.all([
    sb.from('tasks').select('*').order('order'),
    sb.from('uploads').select('*').order('created_at'),
  ]);
  if (t.error) { $('sum').textContent = '資料讀取失敗，請重新整理頁面。'; return; }
  tasks = t.data || []; uploads = u.data || []; loaded = true;
  render();
}

function render() {
  const active = document.activeElement;
  if (active && active.tagName === 'TEXTAREA' && $('map').contains(active)) return; // don't redraw under someone typing
  const done = tasks.filter((t) => t.status === 'done').length;
  $('sum').textContent = !loaded ? '載入中…' : tasks.length ? `已完成 ${done} / ${tasks.length}　·　已上傳 ${uploads.length} 個檔案` : '還沒有項目';
  const map = $('map'); map.replaceChildren();
  for (const [page, secs] of SITE) {
    const row = el('div', { class: 'row' });
    let openBlock = null;
    for (const s of secs) {
      const its = itemsOf(page, s);
      if (!its.length) { row.append(el('span', { class: 'pill sp', text: s })); continue; }
      const left = its.filter((t) => t.status !== 'done').length;
      const key = page + '|' + s, isOpen = open === key;
      row.append(el('button', { class: 'pill sp', 'aria-expanded': String(isOpen), onclick: () => { open = isOpen ? null : key; msg = ''; render(); } },
        [el('span', { text: s }), el('span', { class: 'n' + (left ? '' : ' ok'), text: left ? String(left) : '✓' })]));
      if (isOpen) openBlock = el('div', { class: 'items' }, its.map(item));
    }
    map.append(el('section', { class: 'page' }, [el('div', { class: 'pill pp', text: page }), row, openBlock]));
  }
}

async function save(t, patch) {
  Object.assign(t, patch); render();
  const { error } = await sb.from('tasks').update({ ...patch, updated_at: new Date().toISOString() }).eq('id', t.id);
  msg = error ? '儲存失敗，請再試一次。' : '';
  await load();
}

function item(t) {
  const files = uploads.filter((u) => u.task === t.id);
  const note = el('textarea', { id: 'n-' + t.id, placeholder: '備註、確認結果…', onchange: (e) => save(t, { note: e.target.value }) });
  note.value = t.note || '';
  const input = el('input', { type: 'file', id: 'f-' + t.id, multiple: true, hidden: true, accept: 'image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain', onchange: (e) => upload(t, [...e.target.files]) });
  const up = el('label', { class: 'up', for: 'f-' + t.id, text: '＋ 上傳檔案（也可以拖進來）' });
  ['dragenter', 'dragover'].forEach((ev) => up.addEventListener(ev, (e) => { e.preventDefault(); up.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => up.addEventListener(ev, (e) => { e.preventDefault(); up.classList.remove('over'); }));
  up.addEventListener('drop', (e) => upload(t, [...e.dataTransfer.files]));
  return el('div', { class: 'it' }, [
    el('h3', { text: t.title + (t.optional ? '（選配）' : '') }),
    t.spec ? el('p', { class: 'spec', text: t.spec }) : null,
    el('div', { class: 'st', role: 'group', 'aria-label': '狀態' }, Object.entries(STATUS).map(([k, v]) =>
      el('button', { 'data-s': k, 'aria-pressed': String((t.status || 'todo') === k), onclick: () => save(t, { status: k }), text: v }))),
    note, up, input,
    files.length ? el('div', { class: 'files' }, files.map((f) => {
      const url = fileUrl(f.path);
      return el('div', { class: 'file' }, [
        el('a', { href: url, target: '_blank', rel: 'noopener', title: f.name }, [
          /^image\//.test(f.type || '') ? el('img', { src: url, alt: f.name, loading: 'lazy' }) : null,
          el('span', { class: 'nm', text: f.name })]),
        el('button', { class: 'rm', 'aria-label': '移除 ' + f.name, onclick: () => removeFile(f), text: '×' })]);
    })) : null,
    el('div', { class: 'msg', text: msg }),
  ]);
}

async function upload(t, list) {
  for (const file of list) {
    if (file.size > 20 * 1024 * 1024) { msg = `${file.name} 超過 20 MB，請壓縮後再傳。`; render(); continue; }
    msg = `上傳中：${file.name}`; render();
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `${t.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const r = await sb.storage.from('uploads').upload(path, file, { contentType: file.type || undefined });
    if (r.error) { msg = `${file.name} 上傳失敗，請再試一次。`; render(); continue; }
    const ins = await sb.from('uploads').insert({ task: t.id, path, name: file.name, type: file.type });
    msg = ins.error ? `${file.name} 已上傳但沒有記錄成功，請再試一次。` : '';
    await load();
  }
}
async function removeFile(f) {
  await sb.storage.from('uploads').remove([f.path]);
  const { error } = await sb.from('uploads').delete().eq('id', f.id);
  msg = error ? '移除失敗，請再試一次。' : '';
  await load();
}

render();
load();
setInterval(() => { if (!document.hidden) load(); }, 20000); // pick up other people's changes
</script>
</body>
</html>
